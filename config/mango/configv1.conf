# ENTORNO
env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORMWAYLANDXCB,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt5ct
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=MOZ_ENABLE_WAYLAND,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=SDL_VIDEODRIVER,wayland
xwayland_persistence=1
idleinhibit_ignore_visible=1
cursor_theme=WiiCcwCursorTheme
cursor_size=24

# APARIENCIA
borderpx=2
focuscolor=0x478061ff
bordercolor=0x3B3B3Bff
maximizescreencolor=0x478061ff
gappih=2
gappiv=2
gappoh=3
gappov=3
border_radius=5

# VENTANAS
blur=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02 
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=0
layer_shadows=0
shadow_only_floating=1  
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor= 0x000000ff
animations=1
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.95
fadeout_begin_opacity=0.95
animation_duration_move=250
animation_duration_open=100
animation_duration_tag=150
animation_duration_close=80

# INICIO
exec-once=waybar &
exec-once=swaybg -i ~/Downloads/forest.png
exec-once=mako
exec-once=pipewire & 
exec-once=wireplumber &
exec-once=pipewire-pulse &
exec-once=sleep 2 && easyeffects --gapplication-service &
exec-once=udiskie &
#exec-once=bluetooth off
exec-once=swayidle -w timeout 300 'wlopm --off \*' resume 'wlopm --on \*' before-sleep 'wlomp --off \*' after-resume 'wlopm --on\*'
exec=/usr/libexec/polkit-gnome-authentication-agent-1 

# TECLADO, TOUCHPAD, MOUSE
xkb_rules_layout=us
xkb_rules_variant=intl
trackpad_natural_scrolling=1
trackpad_accel_profile=1
trackpad_accel_speed=1.0
middle_button_emulation=0
disable_trackpad=0
numlockon=0
warpcursor=0
cursor_hide_timeout=1
mouse_accel_profile=1
mouse_accel_speed=1.0

# Modifiers: SUPER, CTRL, ALT, SHIFT, NONE (combine with +, e.g. SUPER+CTRL+ALT).
# ATAJOS
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,spawn,firefox
bind=SUPER,e,spawn,foot -e yazi
bind=SUPER,w,killclient
bind=SUPER,Space,spawn,fuzzel
bind=SUPER+SHIFT,Backspace,quit
bind=SUPER,Backspace,spawn,gtklock
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,Escape,spawn,/home/mario/.local/bin/fuzzel-powermenu

#FUNCIONES
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +1%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 1%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,Print,spawn,grim -g "$(slurp)" ~/captura.png

# WORKSPACES
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5

# FOCUS
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# CAMBIAR LAYOUT
circle_layout=dwindle,scroller
bind=SUPER,l,switch_layout
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
