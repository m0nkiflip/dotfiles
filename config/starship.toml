# Archivo: ~/.config/starship.toml

# Formato general del prompt
format = """
$username$hostname $directory$git_branch$character
"""

# Configurar el usuario
[username]
style_user = "bold #478061"
show_always = true
format = "   [󱞩 m0nkiflip]($style)"

# Configurar el hostname
[hostname]
ssh_only = false
style = "bold #96C5AB"
format = " 󰹻 [$hostname]($style)"

# Configurar el directorio
[directory]
style = "bold #96C5AB"
truncation_length = 3

# Configurar el símbolo final
[character]
success_symbol = "[❯](bold #478061)"
error_symbol = "[❯](bold red)"
